# NordicSDRF campaign manifest — single source of truth for what to annotate
# and how far each city has gotten.
#
# `scripts/update_status.py` reads this file, queries PRIDE, counts manifests and
# annotations/ outputs, and writes the numbers back here (pxd_count, pride_hits,
# screened, annotated, blocked), country `status`, a missing `pxd_list` when
# `lists/<country>/<city>.txt` exists, and into README.md + status/<country>.md.
#
# City fields:
#   name          display name used in tables
#   search_terms  PRIDE full-text keywords (English spelling first; diacritic
#                 forms return almost nothing). Hits across terms are unioned.
#   pxd_list      curated manifest (one PXD per line). Optional: if omitted,
#                 update_status.py uses lists/<country>/<city>.txt when that file exists.
#   pxd_count / pride_hits / screened / annotated / blocked — machine-updated

project: NordicSDRF
description: >
  Annotate Nordic-affiliated PRIDE proteomics datasets with validated SDRF
  files, worked country by country and city by city.

tools:
  sdrf_skills: ../sdrf-skills                       # sibling checkout, not vendored
  sdrf_annotated_datasets: ../sdrf-annotated-datasets

pipeline:
  tier_1_local:
    runner: ollama
    model: qwen3.5:9b-128k
    gpu: "NVIDIA RTX PRO 2000 Blackwell (Laptop)"
    jobs: [dedup_against_corpus, rough_triage]
  tier_2_codex:
    jobs: [sdrf_metascreen, sdrf_fix, sdrf_validate]
  tier_3_claude:
    jobs: [sdrf_annotate, sdrf_review, sdrf_adversarial_review]

pride_hits_queried: 2026-09-23

corpus_source: GitHub bigbio/sdrf-annotated-datasets (2026-09-26)

