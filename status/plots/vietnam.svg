<svg xmlns="http://www.w3.org/2000/svg" width="860" height="136.0" viewBox="0 0 860 136.0" role="img" aria-label="Vietnam SDRF progress by city">
<style>
  .bg { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
  .city { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
  .sub, .legend, .total, .axis { fill: #52514e; font-size: 11.5px; }
  .seg { font-size: 11.5px; font-weight: 600; fill: #ffffff; font-variant-numeric: tabular-nums; }
  .uncurated { fill: none; stroke: #8a8983; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .grid { stroke: #e8e7e2; stroke-width: 1; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .c-annotated { fill: #2a78d6; }
  .c-sandbox { fill: #6b4ea3; }
  .c-blocked { fill: #d95926; }
  .c-in_corpus { fill: #199e70; }
  .c-screened { fill: #c98500; }
  .c-todo { fill: #8a8983; }

  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .title, .city { fill: #ffffff; }
    .sub, .legend, .total, .axis { fill: #c3c2b7; }
    .uncurated { stroke: #8f8e86; }
    .grid { stroke: #3a3a37; }
    .c-annotated { fill: #3987e5; }
    .c-sandbox { fill: #7d5fb5; }
    .c-blocked { fill: #d95926; }
    .c-in_corpus { fill: #199e70; }
    .c-screened { fill: #c98500; }
    .c-todo { fill: #6b6a65; }
  }
</style>
<rect class="bg" width="860" height="136.0" rx="6"/>
<text class="title" x="12" y="22">Vietnam — in progress</text>
<text class="sub" x="12" y="40">5 listed · 1 local SDRFs · 0 sandbox · 1 to do · 3 blocked (not in sandbox) · PRIDE queried 2026-11-26</text>
<rect class="c-annotated" fill="#2a78d6" x="12.0" y="52.0" width="12" height="12" rx="2"/>
<text class="legend" x="29.0" y="62.0">Local SDRF</text>
<rect class="c-sandbox" fill="#6b4ea3" x="117.0" y="52.0" width="12" height="12" rx="2"/>
<text class="legend" x="134.0" y="62.0">Sandbox</text>
<rect class="c-blocked" fill="#d95926" x="201.0" y="52.0" width="12" height="12" rx="2"/>
<text class="legend" x="218.0" y="62.0">Blocked</text>
<rect class="c-in_corpus" fill="#199e70" x="285.0" y="52.0" width="12" height="12" rx="2"/>
<text class="legend" x="302.0" y="62.0">In corpus</text>
<rect class="c-screened" fill="#c98500" x="383.0" y="52.0" width="12" height="12" rx="2"/>
<text class="legend" x="400.0" y="62.0">Screened</text>
<rect class="c-todo" fill="#8a8983" x="474.0" y="52.0" width="12" height="12" rx="2"/>
<text class="legend" x="491.0" y="62.0">To do</text>
<rect class="uncurated" fill="none" stroke="#8a8983" x="544.0" y="52.75" width="12" height="10.5" rx="2"/>
<text class="legend" x="561.0" y="62.0">PRIDE hits, not curated yet</text>
<text class="city" x="12" y="82.0">Hanoi</text>
<rect class="c-annotated" fill="#2a78d6" x="152.0" y="68.0" width="120.2" height="20" rx="2"><title>Hanoi · Local SDRF: 1</title></rect>
<text class="seg" x="212.1" y="82.0" text-anchor="middle">1</text>
<rect class="c-blocked" fill="#d95926" x="273.2" y="68.0" width="362.6" height="20" rx="2"><title>Hanoi · Blocked: 3</title></rect>
<text class="seg" x="454.5" y="82.0" text-anchor="middle">3</text>
<rect class="c-todo" fill="#8a8983" x="636.8" y="68.0" width="120.2" height="20" rx="2"><title>Hanoi · To do: 1</title></rect>
<text class="seg" x="696.9" y="82.0" text-anchor="middle">1</text>
<text class="total" x="764.0" y="82.0">5 listed</text>
<text class="city" x="12" y="112.0">Ho Chi Minh City</text>
<text class="total" x="158.0" y="112.0">0 listed</text>
</svg>
