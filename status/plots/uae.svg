<rect class="c-todo" fill="#8a8983" x="474.0" y="52.0" width="12" height="12" rx="2"/>
<text class="legend" x="491.0" y="62.0">To do</text>
<rect class="uncurated" fill="none" stroke="#8a8983" x="544.0" y="52.75" width="12" height="10.5" rx="2"/>
