<svg xmlns="http://www.w3.org/2000/svg" width="860" height="502" viewBox="0 0 860 502" role="img" aria-label="Southeast Asia SDRF progress by city">
<style>
  .bg { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
