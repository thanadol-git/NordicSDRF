<svg xmlns="http://www.w3.org/2000/svg" width="860" height="322" viewBox="0 0 860 322" role="img" aria-label="Affinity PAD SDRF progress by city">
<style>
  .bg { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
