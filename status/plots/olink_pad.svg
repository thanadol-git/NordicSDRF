  .c-in_corpus { fill: #199e70; }
  .c-screened { fill: #c98500; }
  .c-todo { fill: #8a8983; }

  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .title, .city { fill: #ffffff; }
    .sub, .legend, .total { fill: #c3c2b7; }
    .uncurated { stroke: #8f8e86; }
    .c-annotated { fill: #3987e5; }
    .c-blocked { fill: #d95926; }
    .c-in_corpus { fill: #199e70; }
    .c-screened { fill: #c98500; }
    .c-todo { fill: #6b6a65; }
