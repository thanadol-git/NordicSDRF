<svg xmlns="http://www.w3.org/2000/svg" width="860" height="112" viewBox="0 0 860 112" role="img" aria-label="Iceland SDRF progress by city">
<style>
  .bg { fill: #fcfcfb; }
  .title { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
  .city { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
  .sub, .legend, .total { fill: #52514e; font-size: 11.5px; }
  .seg { font-size: 11.5px; font-weight: 600; fill: #ffffff; font-variant-numeric: tabular-nums; }
  .uncurated { fill: none; stroke: #8a8983; stroke-width: 1.5; stroke-dasharray: 4 3; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .c-annotated { fill: #2a78d6; }
  .c-blocked { fill: #d95926; }
  .c-in_corpus { fill: #199e70; }
  .c-screened { fill: #c98500; }
  .c-todo { fill: #8a8983; }

  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .title, .city { fill: #ffffff; }
    .sub, .legend, .total { fill: #c3c2b7; }
    .uncurated { stroke: #8f8e86; }
    .c-annotated { fill: #3987e5; }
    .c-blocked { fill: #d95926; }
    .c-in_corpus { fill: #199e70; }
    .c-screened { fill: #c98500; }
    .c-todo { fill: #6b6a65; }
  }
</style>
<rect class="bg" width="860" height="112" rx="6"/>
<text class="title" x="12" y="22">Iceland — in progress</text>
<text class="sub" x="12" y="40">6 datasets listed · 4 annotated · PRIDE queried 2026-09-23 · bar length = accessions in the row's manifest (dashed: raw PRIDE hits)</text>
<rect class="c-annotated" fill="#2a78d6" x="12" y="52" width="12" height="12" rx="2"/>
<text class="legend" x="29" y="62">Annotated</text>
<rect class="c-blocked" fill="#d95926" x="110" y="52" width="12" height="12" rx="2"/>
<text class="legend" x="127" y="62">Blocked</text>
<rect class="c-in_corpus" fill="#199e70" x="194" y="52" width="12" height="12" rx="2"/>
<text class="legend" x="211" y="62">In corpus</text>
<rect class="c-screened" fill="#c98500" x="292" y="52" width="12" height="12" rx="2"/>
<text class="legend" x="309" y="62">Screened</text>
<rect class="c-todo" fill="#8a8983" x="383" y="52" width="12" height="12" rx="2"/>
<text class="legend" x="400" y="62">To do</text>
<rect class="uncurated" fill="none" stroke="#8a8983" x="453" y="52.75" width="12" height="10.5" rx="2"/>
<text class="legend" x="470" y="62">PRIDE hits, not curated yet</text>
<text class="city" x="12" y="88.0">Reykjavík</text>
<rect class="c-annotated" fill="#2a78d6" x="110.0" y="74" width="431.0" height="20" rx="2"><title>Reykjavík · Annotated: 4</title></rect>
<text class="seg" x="325.5" y="88.0" text-anchor="middle">4</text>
<rect class="c-blocked" fill="#d95926" x="542.0" y="74" width="215.0" height="20" rx="2"><title>Reykjavík · Blocked: 2</title></rect>
<text class="seg" x="649.5" y="88.0" text-anchor="middle">2</text>
<text class="total" x="764.0" y="88.0">6 listed</text>
</svg>
