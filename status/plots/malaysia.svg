<rect class="c-in_corpus" fill="#199e70" x="415.7" y="68.0" width="279.1" height="20" rx="2"><title>Kuala Lumpur · In corpus: 18</title></rect>
<text class="seg" x="555.2" y="82.0" text-anchor="middle">18</text>
<rect class="c-todo" fill="#8a8983" x="695.8" y="68.0" width="61.2" height="20" rx="2"><title>Kuala Lumpur · To do: 4</title></rect>
<text class="seg" x="726.4" y="82.0" text-anchor="middle">4</text>
<text class="total" x="764.0" y="82.0">41 listed</text>
<text class="city" x="12" y="112.0">Penang</text>
