name: Daily status refresh

on:
  schedule:
    # Midnight CET = 23:00 UTC. During CEST this runs at 01:00 local
    # (GitHub Actions cron is UTC-only and does not follow DST).
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-status
  cancel-in-progress: false

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Full PRIDE status refresh
        env:
          # Authenticated api.github.com calls avoid the unauthenticated rate limit
          # that zeroed in_corpus on the first scheduled/manual run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_status.py --corpus github

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No status changes to commit"
            exit 0
          fi
          git commit -m "chore: daily status refresh ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main
